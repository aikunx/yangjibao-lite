# Gradle 构建参数（参考 Android 官方「缩减、混淆处理和优化应用」）
# https://developer.android.google.cn/build/shrink-code

android.overridePathCheck=true
android.useAndroidX=true
kotlin.code.style=official

# R8 完全模式：比默认更激进地内联与裁剪，减小体积并提升运行速度
android.enableR8.fullMode=true

# 资源优化：合并重复资源、移除无用资源
android.enableResourceOptimizations=true

# 非传递性 R 类：只保留实际用到的资源 ID，减小 dex
android.nonTransitiveRClass=true

# 构建缓存。并行关闭：单模块项目并行收益很小，
# 但每个 worker 都要独立占一份内存，反而更容易把机器压垮
org.gradle.caching=true
org.gradle.parallel=false

# 内存上限。
#
# 之前是 -Xmx2048m，加上 Kotlin daemon 和 R8 worker，
# 构建峰值能到 3~4GB，和运行时环境抢内存，整机就会卡。
# 这个项目规模不大，1536m 完全够用。
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Kotlin 编译进程单独限一份，避免它跟着一起涨
kotlin.daemon.jvmargs=-Xmx1024m

# 同时最多 2 个 worker
org.gradle.workers.max=2
