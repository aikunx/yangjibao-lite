<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<title>养基宝 Lite</title>
<!--@@SLOT@@-->
<!--@@SLOT@@-->
</head>
<body>

<!-- 顶栏：标题 + 操作按钮 -->
<header class="appbar">
  <div class="apptitle" id="apptitle">持仓</div>
  <!--
    顶栏原来放的是「搜索」和「＋」，两个入口其实干的是同一件事：
    加基金。既然把它们挪到了持仓列表最下面（那里更顺手，也不用
    先回资产页），顶栏就腾出来给一个真正随手要用的开关 ——
    日间 / 夜间模式。
  -->
  <button class="icobtn themebtn" id="btnTheme" title="切换夜间模式">
    <svg class="ico-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"/>
    </svg>
    <svg class="ico-moon" viewBox="0 0 24 24">
      <path d="M20.4 14.8A8.6 8.6 0 0 1 9.2 3.6a8.6 8.6 0 1 0 11.2 11.2z"/>
    </svg>
  </button>
</header>

<!-- 分组芯片：仅持仓页显示 -->
<div class="chips" id="chips"></div>

<!-- 下拉刷新指示器：跟随手指位移，松手后回弹 -->
<div class="ptr" id="ptr" aria-hidden="true">
  <div class="ptr-in">
    <svg class="ptr-ico" viewBox="0 0 24 24">
      <path d="M12 4v13M6.5 12L12 17.5 17.5 12"/>
    </svg>
    <span class="ptr-txt" id="ptrTxt">下拉刷新</span>
  </div>
</div>

<main id="main"></main>

<!-- 固定底部指数条：脱离滚动区，始终贴在导航上方 -->
<div class="idxbar" id="idxbar" style="display:none"><div class="idxroll" id="idxroll"></div></div>

<nav>
  <button data-tab="hold" class="on">
    <!-- 钱包：一眼看出是「我的钱」，比原来的柱状图贴题 -->
    <svg viewBox="0 0 24 24">
      <rect x="3" y="6.4" width="18" height="11.6" rx="3"/>
      <path d="M3 10.4h18"/>
      <path d="M16.2 14.2h1.8"/>
    </svg>
    资产
  </button>
  <button data-tab="market">
    <!--
      走势折线 + 端点。
      本来画的是两根蜡烛（更贴「K 线」这个功能），但底栏图标只有
      21px，蜡烛的实体和影线在这个尺寸下全糊成两根针，反而难看。
      折线在小尺寸下线条清晰、走向一眼可读，更稳。
    -->
    <svg viewBox="0 0 24 24">
      <path d="M3.4 16.8l4.6-5.1 3.3 3 5.1-6.5"/>
      <circle cx="19" cy="5.8" r="2.1"/>
    </svg>
    行情
  </button>
  <button data-tab="discover">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M15.4 8.6l-2.1 4.7-4.7 2.1 2.1-4.7z"/></svg>
    发现
  </button>
  <button data-tab="me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.5 3.1-5.8 7-5.8s7 2.3 7 5.8"/></svg>
    我的
  </button>
</nav>

<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<!--@@SLOT@@-->
</body>
</html>
